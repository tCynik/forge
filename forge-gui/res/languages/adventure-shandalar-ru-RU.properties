#AdventureQuestData.java - quest 28 "Entering Shandalar" (adventure localization PoC)
adv.shandalar.q28.name=Прибытие в Шандалар
adv.shandalar.q28.desc=Узнайте больше об окружающем мире.
adv.shandalar.q28.prologue.text=Вокруг вас тьма и тишина. Смутное ощущение падения с каждой секундой становится всё слабее.
adv.shandalar.q28.prologue.opt1.name=Где я? Кто я? Что происходит? (Обучение и основной сюжет)
adv.shandalar.q28.prologue.opt1.text=Вспышка света, ярче всего, что вы можете вспомнить, предшествует падению на каменный пол. Это потрясение почти так же сильно, как осознание того, что вы почти ничего не помните.
adv.shandalar.q28.prologue.opt1.opt1.name=Стоит поговорить с магом вон там.
adv.shandalar.q28.prologue.opt1.opt1.text=Тихий треск привлекает ваш взгляд к мерцающему огню в пещере, где вы оказались. У костра стоит фигура в капюшоне, повернувшись к вам, будто ожидая вашего появления.
adv.shandalar.q28.prologue.opt2.name=Я хочу найти планесвокеров (появится в будущем обновлении)
adv.shandalar.q28.prologue.opt2.text=Что ж, кричать «Планесвокеры, где вы?» посреди пустошей — занятие бесполезное. Отправляйтесь в ближайшее поселение и порасспрашивайте местных.
adv.shandalar.q28.prologue.opt2.opt1.name=(Продолжить)
adv.shandalar.q28.prologue.opt2.opt1.text=Новый квест: Разговор с местными — Задача\: добраться до любого города в пустошах.
adv.shandalar.q28.prologue.opt2.opt1.opt1.name=(Закрыть)
adv.shandalar.q28.prologue.opt3.name=Я хочу прославиться (появится в будущем обновлении)
adv.shandalar.q28.prologue.opt3.text=Тогда пора кого-нибудь впечатлить. Но сперва вам понадобятся впечатляющие заклинания. Соберите свою коллекцию, чтобы начать этот путь.
adv.shandalar.q28.prologue.opt3.opt1.name=(Закрыть)
adv.shandalar.q28.prologue.opt4.name=Всё это уже было. Давайте сразу к врагам. (Новая игра+)
adv.shandalar.q28.prologue.opt4.text=Хорошо, пропускаем всю ту работу, что кто-то вложил в этот диалог, — портал открывается, и вы можете отправляться дальше.
adv.shandalar.q28.prologue.opt4.opt1.name=(Продолжить)
