#AdventureQuestData.java - quest 28 "Entering Shandalar" (adventure localization mechanism cross-check)
adv.shandalar.q28.name=L'arrivée à Shandalar
adv.shandalar.q28.desc=Découvrez votre environnement.
adv.shandalar.q28.prologue.text=Les ténèbres et le silence vous entourent. Une vague sensation de chute ralentit seconde après seconde.
adv.shandalar.q28.prologue.opt1.name=Où suis-je ? Qui suis-je ? Que se passe-t-il ? (Didacticiel et quête principale)
adv.shandalar.q28.prologue.opt1.text=Un éclair de lumière plus vif que tout ce dont vous vous souvenez précède une chute sur un sol de pierre. C'est presque aussi troublant que de réaliser que vous ne vous souvenez en réalité de presque rien.
adv.shandalar.q28.prologue.opt1.opt1.name=Autant aller parler à ce mage là-bas.
adv.shandalar.q28.prologue.opt1.opt1.text=Un léger crépitement attire votre regard vers la lumière vacillante d'un feu dans la grotte que vous occupez désormais. Une silhouette encapuchonnée se tient près du feu, tournée vers vous comme si elle attendait votre arrivée.
adv.shandalar.q28.prologue.opt2.name=Je veux retrouver les planeswalkers (à venir)
adv.shandalar.q28.prologue.opt2.text=Bon, crier « Planeswalkers, où êtes-vous ? » dans ces étendues désolées ne servira pas à grand-chose. Rendez-vous dans la colonie la plus proche et posez des questions.
adv.shandalar.q28.prologue.opt2.opt1.name=(Continuer)
adv.shandalar.q28.prologue.opt2.opt1.text=Nouvelle quête\: Discussion avec les habitants — Objectif\: rendez-vous dans n'importe quelle ville des terres désolées.
adv.shandalar.q28.prologue.opt2.opt1.opt1.name=(Fermer)
adv.shandalar.q28.prologue.opt3.name=Je veux me faire un nom (à venir)
adv.shandalar.q28.prologue.opt3.text=Alors allons impressionner du monde. Mais d'abord, il vous faut des sorts impressionnants. Constituez votre collection pour commencer cette quête.
adv.shandalar.q28.prologue.opt3.opt1.name=(Fermer)
adv.shandalar.q28.prologue.opt4.name=Déjà vu, déjà fait. Montrez-moi les ennemis. (Nouvelle partie+)
adv.shandalar.q28.prologue.opt4.text=D'accord, on saute tout le travail que quelqu'un a mis dans ce dialogue\: le portail s'ouvre et vous pouvez partir.
adv.shandalar.q28.prologue.opt4.opt1.name=(Continuer)
